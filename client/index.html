<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Chowk — a UI/UX sample of a multi-vendor marketplace: storefront, Seller Hub and Admin. All data is synthetic." />
    <title>Chowk</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        var pref = localStorage.getItem('chowk:theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
